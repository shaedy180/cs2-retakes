name: Build and release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: ${{ (github.event_name != 'push' || github.ref != 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Require release revision on main
        if: github.event_name == 'release'
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Locked restore, vulnerability audit and build
        run: |
          set -euo pipefail
          dotnet restore RetakesPluginShared/RetakesPluginShared.csproj --locked-mode
          dotnet build RetakesPluginShared/RetakesPluginShared.csproj -c Release --no-restore
          dotnet restore RetakesPlugin/RetakesPlugin.csproj --locked-mode
          dotnet build RetakesPlugin/RetakesPlugin.csproj -c Release --no-restore
      - run: dotnet format RetakesPluginShared/RetakesPluginShared.csproj --no-restore --verify-no-changes
      - run: dotnet format RetakesPlugin/RetakesPlugin.csproj --no-restore --verify-no-changes
      - run: dotnet run --project tests/Lifecycle -c Release
      - run: dotnet run --project tests/Timers -c Release
      - run: python3 scripts/package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugins-${{ github.sha }}
          path: |
            *.zip
            *.zip.sha256
          if-no-files-found: error
          retention-days: 7
  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: plugins-${{ github.sha }}
          path: artifacts
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*

  ci_provenance:
    name: CI provenance
    if: always()
    needs: ["build", "release"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - name: Test verification safeguards
        run: node --test .github/scripts/ci-provenance.test.cjs
      - name: Record PR validation or verify merged source
        id: receipt
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
          CI_REQUIRED_JOBS: '["build"]'
        with:
          script: |
            await require('./.github/scripts/ci-provenance.cjs')({ github, context, core });
      - name: Preserve successful PR validation receipt
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.receipt.outputs.artifact }}
          path: ci-validation.json
          if-no-files-found: error
          retention-days: 14
