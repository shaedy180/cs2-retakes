name: Build and release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: ${{ (github.event_name != 'push' || github.ref != 'refs/heads/main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Require release revision on main
        if: github.event_name == 'release'
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Locked restore, vulnerability audit and build
        run: |
          set -euo pipefail
          dotnet restore RetakesPluginShared/RetakesPluginShared.csproj --locked-mode
          dotnet build RetakesPluginShared/RetakesPluginShared.csproj -c Release --no-restore
          dotnet restore RetakesPlugin/RetakesPlugin.csproj --locked-mode
          dotnet build RetakesPlugin/RetakesPlugin.csproj -c Release --no-restore
      - run: dotnet format RetakesPluginShared/RetakesPluginShared.csproj --no-restore --verify-no-changes
      - run: dotnet format RetakesPlugin/RetakesPlugin.csproj --no-restore --verify-no-changes
      - run: dotnet run --project tests/Lifecycle -c Release
      - run: python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: plugins-${{ github.sha }}
          path: |
            *.zip
            *.zip.sha256
          if-no-files-found: error
  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plugins-${{ github.sha }}
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*

  ci_provenance:
    name: CI provenance
    if: always()
    needs: ["build", "release"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
      - name: Test verification safeguards
        run: node --test .github/scripts/ci-provenance.test.cjs
      - name: Record PR validation or verify merged source
        id: receipt
        uses: actions/github-script@v8
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
          CI_REQUIRED_JOBS: '["build"]'
        with:
          script: |
            await require('./.github/scripts/ci-provenance.cjs')({ github, context, core });
      - name: Preserve successful PR validation receipt
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.receipt.outputs.artifact }}
          path: ci-validation.json
          if-no-files-found: error
          retention-days: 90
